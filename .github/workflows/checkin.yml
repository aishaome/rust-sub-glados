name: GLaDOS checkin

on:
  workflow_dispatch:
  schedule:
    # UTC 02:00 每天一次，即北京时间 10:00，之后再随机延迟 0 ~ 4 小时，签到时间落在 10:00 ~ 14:00 之间
    - cron: "0 2 * * *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: Asia/Shanghai

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # 定时触发时随机延迟 0 ~ 4 小时（10:00 起算，最晚 14:00 前完成）；手动触发立即执行
      - name: Random delay
        if: github.event_name == 'schedule'
        run: |
          delay=$((RANDOM % 14400))
          echo "延迟 $((delay / 3600)) 时 $((delay % 3600 / 60)) 分 $((delay % 60)) 秒"
          sleep "$delay"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      # 恢复上次保存的 GLaDOS cookie（cache 不可覆盖，按前缀取最新一份）
      # 从 secret GLADOS_COOKIES 取出上次保存的 cookie，并留一份原值用于比对
      - name: Restore cookies
        env:
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
        run: |
          if [ -n "$GLADOS_COOKIES" ]; then
            printf '%s' "$GLADOS_COOKIES" > glados-cookies.json
            cp glados-cookies.json "$RUNNER_TEMP/cookies-orig.json"
            echo "已从 secret 恢复 cookie"
          else
            echo "secret GLADOS_COOKIES 为空，将使用邮箱登录"
          fi

      # 公开仓库的日志所有人可见：逐个遮蔽邮箱与授权码（secret 只会整串遮蔽）
      # 每个账号是否已签到由程序读取积分历史判断，已签到则不再提交签到请求
      - name: Checkin
        run: |
          for item in ${GLADOS_EMAILS//,/ } ${MAIL_ACCOUNTS//[,:]/ }; do
            echo "::add-mask::$item"
          done
          ./target/release/email
        env:
          MAIL_ACCOUNTS: ${{ secrets.MAIL_ACCOUNTS }}
          GLADOS_EMAILS: ${{ secrets.GLADOS_EMAILS }}
          CORP_ID: ${{ secrets.CORP_ID }}
          SECRET: ${{ secrets.SECRET }}
          AGENT_ID: ${{ secrets.AGENT_ID }}
          TOUSER: ${{ secrets.TOUSER }}
          MAIL_NOTIFY_URL: ${{ secrets.MAIL_NOTIFY_URL }}
          MAIL_NOTIFY_TOKEN: ${{ secrets.MAIL_NOTIFY_TOKEN }}

      # cookie 有变化时写回 secret（需要有 Secrets 写权限的 PAT，存为 secret GH_PAT）
      - name: Save cookies
        if: always() && hashFiles('glados-cookies.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if cmp -s glados-cookies.json "$RUNNER_TEMP/cookies-orig.json"; then
            echo "cookie 未变化，无需更新 secret"
          elif [ -z "$GH_TOKEN" ]; then
            echo "::warning::未配置 secret GH_PAT，cookie 无法保存，下次将重新邮箱登录"
          else
            gh secret set GLADOS_COOKIES --repo "$GITHUB_REPOSITORY" < glados-cookies.json
            echo "已更新 secret GLADOS_COOKIES"
          fi
