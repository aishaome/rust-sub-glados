name: GLaDOS checkin

on:
  workflow_dispatch:
    inputs:
      force:
        description: "立即签到（忽略随机与今日已签到标记）"
        type: boolean
        default: true
  schedule:
    # UTC 00:23 ~ 11:23 每小时一次，即北京时间 08:23 ~ 19:23
    - cron: "23 0-11 * * *"

permissions:
  contents: read
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: Asia/Shanghai

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Today
        id: today
        run: echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # 今日已签到的标记（只查是否存在，不下载）
      - name: Check done marker
        id: marker
        uses: actions/cache/restore@v4
        with:
          path: .checkin-done
          key: checkin-done-${{ steps.today.outputs.date }}
          lookup-only: true

      # 每次以 1/剩余次数 的概率执行，最后一次（19 点）必定执行，
      # 因此签到时间在 8 ~ 20 点之间均匀随机，且漏跑的排程会由后续补上
      - name: Decide
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "手动触发，立即签到"; exit 0
          fi
          if [ "${{ steps.marker.outputs.cache-hit }}" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "今日已签到，跳过"; exit 0
          fi
          hour=$((10#$(date +%H)))
          remaining=$((20 - hour))
          if [ "$remaining" -le 1 ] || [ $((RANDOM % remaining)) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "北京时间 ${hour} 点：本次执行签到"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "北京时间 ${hour} 点：本次跳过（概率 1/${remaining}）"
          fi

      - name: Checkout
        if: steps.decide.outputs.run == 'true'
        uses: actions/checkout@v6

      - name: Set up Rust
        if: steps.decide.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        if: steps.decide.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Build
        if: steps.decide.outputs.run == 'true'
        run: cargo build --release

      # 随机延迟 0 ~ 30 分钟（最晚 19:23 的排程也能在 20 点前完成），让签到时间精确到分钟也随机
      - name: Random delay
        if: steps.decide.outputs.run == 'true' && github.event_name == 'schedule'
        run: |
          delay=$((RANDOM % 1800))
          echo "延迟 $((delay / 60)) 分 $((delay % 60)) 秒"
          sleep "$delay"

      - name: Checkin
        if: steps.decide.outputs.run == 'true'
        run: ./target/release/email
        env:
          MAIL_ACCOUNTS: ${{ secrets.MAIL_ACCOUNTS }}
          GLADOS_EMAILS: ${{ secrets.GLADOS_EMAILS }}
          CORP_ID: ${{ secrets.CORP_ID }}
          SECRET: ${{ secrets.SECRET }}
          AGENT_ID: ${{ secrets.AGENT_ID }}
          TOUSER: ${{ secrets.TOUSER }}

      - name: Create done marker
        if: steps.decide.outputs.run == 'true'
        run: touch .checkin-done

      - name: Save done marker
        if: steps.decide.outputs.run == 'true' && steps.marker.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .checkin-done
          key: checkin-done-${{ steps.today.outputs.date }}
